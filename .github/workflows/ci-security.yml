name: ci-security

# Secrets, SAST, SCA and container scanning.
#
# Gating model (see docs/security-gate-policy.md):
#   * Code we own (this repository) -> findings FAIL the pipeline.
#   * OWASP Juice Shop (intentionally vulnerable third-party target) ->
#     findings are evidence; a release decision is computed and reported,
#     but the target is never promoted anywhere, so it does not fail CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tool images pinned by digest (tag kept for readability). Updated by Dependabot/review.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP_IMAGE: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  # Lab target, pinned by tag + verified commit / image digest.
  JUICE_SHOP_REF: v20.4.0
  JUICE_SHOP_COMMIT: 266448aba68cd8ba5915f526a128da4fa7bc3f9f
  JUICE_SHOP_IMAGE: bkimminich/juice-shop:v20.4.0@sha256:9bbaecc41791f00b002bc65931cc5ff355fbdb941fa72b06558c18dace43197b

jobs:
  secrets:
    name: Secrets - Gitleaks (gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
          persist-credentials: false

      - name: Gitleaks - full git history
        run: |
          mkdir -p ci-reports/gitleaks
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git /repo --config /repo/security/gitleaks/gitleaks.toml --redact --no-banner \
            --report-format json --report-path /repo/ci-reports/gitleaks/gitleaks-repo.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-gitleaks-repo
          path: ci-reports/
          retention-days: 30

  sast:
    name: SAST - Semgrep on this repo (gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit-test custom Semgrep rules
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --no-git-ignore --config security/semgrep/lab-rules.yaml \
            --json security/semgrep/fixtures > semgrep-fixtures.json
          python3 scripts/test-semgrep-rules.py < semgrep-fixtures.json

      - name: Semgrep - registry rulesets + lab rules
        run: |
          mkdir -p ci-reports/semgrep
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --error \
              --config p/github-actions --config p/terraform --config p/secrets \
              --config security/semgrep/lab-rules.yaml \
              --exclude security/semgrep/fixtures --exclude security/checkov/tests \
              --exclude reports --exclude ci-reports --exclude target \
              --json --output ci-reports/semgrep/semgrep-repo.json \
              --sarif-output ci-reports/semgrep/semgrep-repo.sarif

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('ci-reports/semgrep/semgrep-repo.sarif') != ''
        uses: github/codeql-action/upload-sarif@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          sarif_file: ci-reports/semgrep/semgrep-repo.sarif
          category: semgrep-repo

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-semgrep-repo
          path: ci-reports/
          retention-days: 30

  target-analysis:
    name: Juice Shop source - SAST / secrets / SCA (evidence)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch Juice Shop source at pinned, verified commit
        run: |
          git clone --quiet --depth 1 --branch "$JUICE_SHOP_REF" \
            https://github.com/juice-shop/juice-shop.git target/juice-shop
          actual="$(git -C target/juice-shop rev-parse HEAD)"
          if [ "$actual" != "$JUICE_SHOP_COMMIT" ]; then
            echo "::error::Juice Shop $JUICE_SHOP_REF resolved to $actual, expected $JUICE_SHOP_COMMIT"
            exit 1
          fi

      - name: Semgrep - Juice Shop source
        run: |
          mkdir -p ci-reports/semgrep
          # Scan an explicit target path from the repo root; ** globs keep the exclusions
          # anchored no matter which directory Semgrep resolves as the project root.
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --no-git-ignore \
              --config p/owasp-top-ten --config p/javascript --config p/typescript --config p/nodejsscan \
              --config security/semgrep/lab-rules.yaml \
              --exclude '**/*.spec.ts' --exclude '**/test/**' \
              --exclude '**/data/static/codefixes/**' --exclude '**/node_modules/**' \
              --json --output ci-reports/semgrep/semgrep-juice-shop.json \
              target/juice-shop

      - name: Gitleaks - Juice Shop source
        run: |
          mkdir -p ci-reports/gitleaks
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            dir /repo/target/juice-shop --redact --no-banner --exit-code 0 \
            --report-format json --report-path /repo/ci-reports/gitleaks/gitleaks-juice-shop-source.json

      - name: Trivy - Juice Shop source tree (vuln, misconfig, secret)
        run: |
          mkdir -p ci-reports/trivy
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" \
            fs --quiet --scanners vuln,misconfig,secret --format json \
            --output ci-reports/trivy/trivy-fs-juice-shop.json target/juice-shop

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-target-source
          path: ci-reports/
          retention-days: 30

  container:
    name: Container image - Trivy + release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy - image vulnerabilities
        run: |
          mkdir -p ci-reports/trivy
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --format json \
            --output ci-reports/trivy/trivy-image.json "$JUICE_SHOP_IMAGE"

      - name: Release gate - block on fixable CRITICAL / HIGH
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open("ci-reports/trivy/trivy-image.json", encoding="utf-8"))
          vulns = [v for r in data.get("Results", []) for v in (r.get("Vulnerabilities") or [])]
          crit = [v for v in vulns if v["Severity"] == "CRITICAL" and v.get("FixedVersion")]
          high = [v for v in vulns if v["Severity"] == "HIGH" and v.get("FixedVersion")]
          blocked = bool(crit or high)
          print("## Release gate - Juice Shop image")
          print(f"Fixable CRITICAL: **{len(crit)}** - fixable HIGH: **{len(high)}**\n")
          print("**Decision: BLOCKED**" if blocked else "**Decision: PASS**")
          print("\nThe lab target is never promoted, so this decision is recorded "
                "as evidence instead of failing CI. See docs/security-gate-policy.md.")
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-container
          path: ci-reports/
          retention-days: 30

  summary:
    name: Security summary
    if: always()
    needs: [secrets, sast, target-analysis, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reports-*
          path: ci-reports # CI writes only to ci-reports/, never to the committed evidence in reports/
          merge-multiple: true

      - name: Summarise
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          SAST_RESULT: ${{ needs.sast.result }}
        run: |
          python3 scripts/summarize_reports.py ci-reports >> "$GITHUB_STEP_SUMMARY"
          echo "Gating jobs: secrets=$SECRETS_RESULT, sast=$SAST_RESULT" >> "$GITHUB_STEP_SUMMARY"
